# 供 Cloudflare「Workers 构建」里必填的部署命令：npx wrangler deploy
# 文档：https://developers.cloudflare.com/workers/static-assets/routing/single-page-application/
#
# 须与 Cloudflare Workers Builds / 控制台里的 Worker 名称一致（日志里为 odlled-com）
name = "odlled-com"
compatibility_date = "2026-05-08"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
